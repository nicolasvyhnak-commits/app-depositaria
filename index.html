<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mi Cartera"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon.png"><meta name="theme-color" content="#1B4FD6">
<title>Mi Cartera PPI</title>
<style>
:root{--bg:#F2F4F7;--s:#fff;--ink:#101A24;--mut:#586574;--line:#D7DDE5;--acc:#1B4FD6;--accI:#fff;--g:#0E7A55;--l:#BF3126;--wb:#FFF1CF;--wi:#654500;--ib:#E3EBFB}
@media(prefers-color-scheme:dark){:root{--bg:#0C1218;--s:#141C25;--ink:#E7EDF3;--mut:#93A1B1;--line:#25303C;--acc:#7AA2FF;--accI:#0C1218;--g:#3DD598;--l:#FF7A6E;--wb:#3A2E10;--wi:#F2D58A;--ib:#1B2A47}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px max(16px,env(safe-area-inset-right)) 100px max(16px,env(safe-area-inset-left))}
.w{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}h1{font-size:22px}h2{font-size:19px}h3{font-size:15px}
.c{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.big{font:600 30px ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.verdict{font-size:34px;font-weight:700;line-height:1.1}
.m{color:var(--mut);font-size:13px}.t{font-weight:600}
.r{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.r b{font:600 14px ui-monospace,Menlo,monospace;text-align:right;overflow-wrap:anywhere}
.g{color:var(--g)}.l{color:var(--l)}
.note{background:var(--wb);color:var(--wi);padding:10px 12px;border-radius:8px;font-size:14px}
.info{background:var(--ib);padding:10px 12px;border-radius:8px;font-size:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{font-size:13px;min-height:140px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.btn{font:inherit;font-weight:600;min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--s);color:var(--ink);cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accI)}
details{font-size:14px;color:var(--mut)}summary{cursor:pointer;color:var(--acc);font-weight:500;min-height:32px;display:flex;align-items:center}
details p{margin-top:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--s);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px,env(safe-area-inset-left))}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tabs a{text-align:center;padding:13px 0 11px;font-size:10px;font-weight:600;color:var(--mut);text-decoration:none;border-top:3px solid transparent}
.tabs a.on{color:var(--acc);border-top-color:var(--acc)}
.lt{border-top:1px solid var(--line);padding:2px 0}.lt summary{color:var(--ink);font-weight:500;justify-content:space-between;gap:8px;list-style:none}.lt summary::-webkit-details-marker{display:none}
.lt summary span.v{font:600 13px ui-monospace,Menlo,monospace;text-align:right;color:var(--ink);flex:0 1 55%}.lt summary span.n{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
.dot{flex:none;width:11px;height:11px;border-radius:50%;background:var(--mut)}.d-g{background:var(--g)}.d-r{background:var(--l)}.d-y{background:#E0A100}.d-n{background:var(--mut)}
.spark{width:100%;height:auto;display:block}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
[hidden]{display:none!important}
</style>
<body>
<div class="w">
  <h1>Mi Cartera PPI</h1>
  <p class="m" id="st">Cargando tus datos de PPI…</p>
  <section id="v-resumen" class="w" data-v="resumen"></section>
  <section id="v-posiciones" class="w" data-v="posiciones" hidden></section>
  <section id="v-vender" class="w" data-v="vender" hidden></section>
  <section id="v-reparto" class="w" data-v="reparto" hidden></section>
  <section id="v-metas" class="w" data-v="metas" hidden></section>
  <section id="v-analisis" class="w" data-v="analisis" hidden></section>
  <section id="v-consejos" class="w" data-v="consejos" hidden></section>
</div>
<nav class="tabs"><div>
  <a href="#resumen" data-t="resumen">Resumen</a><a href="#posiciones" data-t="posiciones">Tenés</a><a href="#vender" data-t="vender">Vender</a><a href="#reparto" data-t="reparto">Reparto</a><a href="#metas" data-t="metas">Metas</a><a href="#analisis" data-t="analisis">Análisis</a><a href="#consejos" data-t="consejos">Consejos</a>
</div></nav>
<script>
(function(){
'use strict';
var KEY='cartera-ppi-v1';
var $=function(id){return document.getElementById(id)};
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nf(d){return new Intl.NumberFormat('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d})}
var n0=nf(0),n2=nf(2);
function f0(n){return n==null||!isFinite(n)?'—':n0.format(n)}
function f2(n){return n==null||!isFinite(n)?'—':n2.format(n)}
function ars(n){return n==null||!isFinite(n)?'—':(n<0?'−':'')+'$'+n0.format(Math.abs(n))}
function usd(n){return n==null||!isFinite(n)?'—':(n<0?'−':'')+'US$'+n2.format(Math.abs(n))}
function sg(n,u){if(n==null||!isFinite(n))return '—';var r=Math.round(n*100)/100;return (r>0?'+':r<0?'−':'')+(u==='usd'?'US$'+n2.format(Math.abs(n)):u==='%'?n2.format(Math.abs(n))+'%':'$'+n0.format(Math.abs(n)))}
function cls(n){return n>0.004?'g':n<-0.004?'l':''}
function fi(n){return n==null||!isFinite(n)?'':String(Math.round(n*10000)/10000).replace('.',',')}
function parse(s){if(s==null)return NaN;var t=String(s).trim().replace(/\s|\$/g,'');if(!t)return NaN;
  if(t.indexOf(',')>=0&&t.indexOf('.')>=0)t=t.replace(/\./g,'').replace(',','.');else if(t.indexOf(',')>=0)t=t.replace(',','.');
  else if(/^[1-9]\d{0,2}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');var n=Number(t);return isFinite(n)?n:NaN}

/* ---- estado guardado en este celular ---- */
function defState(){return {budget:4000000,comPct:0.7865,usd:null,obj:{SPY:50,MSFT:10,GOOGL:10,V:10,JNJ:10,KO:10},prices:{},meta:defMeta()}}
function defMeta(){return {debt:3000,monthly:50,pays:[],resAmt:500,resDate:'2027-01-15'}}
var S=defState();
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);S=Object.assign(defState(),o)}}catch(e){}
S.meta=Object.assign(defMeta(),S.meta||{});if(!Array.isArray(S.meta.pays))S.meta.pays=[];
if(!Array.isArray(S.watch)||!S.watch.length)S.watch=['NVDA','MU','MSFT','GOOGL','AMD'];
if(S.comV!==3){S.comV=3;S.comPct=0.7865}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---- datos de PPI ---- */
var M=null, D=null, items=[], cash=[], rateImplied=null, totalInst=0;
function load(){
  fetch('/api/posiciones').then(function(r){if(r.status===401){location.reload();throw new Error('sesión')}return r.json()}).then(function(d){
    if(d.detail){$('st').textContent='Error: '+d.detail;return}
    D=d;process();loadMov();$('st').textContent='Datos reales de tu cuenta en PPI · '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    renderAll();
  }).catch(function(e){$('st').textContent='No pude cargar los datos: '+e});
}
function loadMov(){fetch('/api/movimientos').then(function(r){return r.json()}).then(function(d){M=d&&!d.detail?d:null;renderAll()}).catch(function(){})}
function curOf(c){c=String(c||'').toLowerCase();return c.indexOf('dolar')>=0||c.indexOf('usd')>=0?'USD':'ARS'}
function process(){
  items=[];cash=[];rateImplied=null;totalInst=0;
  (D.groupedInstruments||[]).forEach(function(g){
    var gv=g.groupedValue||0;totalInst+=gv;
    var sumAmt=0,allUsd=true;
    (g.instruments||[]).forEach(function(i){sumAmt+=i.amount||0;if(curOf(i.currency)!=='USD')allUsd=false});
    if(allUsd&&sumAmt>0&&!rateImplied)rateImplied=gv/sumAmt;
  });
  var rate=S.usd||rateImplied;
  (D.groupedInstruments||[]).forEach(function(g){
    (g.instruments||[]).forEach(function(i){
      var cur=curOf(i.currency),p=i.ppc||{};
      items.push({group:g.name||'',ticker:i.ticker,desc:i.description||'',cur:cur,qty:i.quantity||0,price:i.price,amount:i.amount||0,
        ppc:p.ppcValue,ret:p.cumulativeReturn,retPct:p.cumulativeReturnPercentage,
        ars:cur==='ARS'?(i.amount||0):(rate?(i.amount||0)*rate:null)});
    });
  });
  (D.groupedAvailability||[]).forEach(function(g){
    (g.availability||[]).forEach(function(a){if(a.settlement==='INMEDIATA'&&a.amount>0)cash.push({name:g.currency,cur:a.symbol==='USD'?'USD':'ARS',amount:a.amount})});
  });
}
function rate(){return S.usd||rateImplied}
function cashArs(){var r=rate(),t=0;cash.forEach(function(c){t+=c.cur==='ARS'?c.amount:(r?c.amount*r:0)});return t}
function realFor(i){
  if(!Array.isArray(M)||!(i.qty>0))return null;
  var cur=i.cur==='USD'?/dolar/i:/pesos/i,tk=String(i.ticker).toUpperCase();
  var rows=M.filter(function(m){return String(m.ticker).toUpperCase()===tk&&cur.test(m.currency||'')}).sort(function(a,b){return String(a.agreementDate).localeCompare(String(b.agreementDate))});
  var q=0,c=0;
  rows.forEach(function(m){var d=String(m.description||'');
    if(/^COMPRA/i.test(d)){q+=Number(m.quantity)||0;c+=-(Number(m.amount)||0)}
    else if(/^VENTA/i.test(d)&&q>0){var avg=c/q,x=Math.min(-(Number(m.quantity)||0),q);c-=avg*x;q-=x}});
  if(!(q>0)||Math.abs(q-i.qty)/i.qty>0.005)return null;
  var inc=0,re=new RegExp(tk.replace(/[^A-Z0-9]/g,''),'i');
  M.forEach(function(m){var d=String(m.description||'');
    if(Number(m.amount)>0&&re.test(d)&&/interest|renta|cup[oó]n|dividend|amortiz/i.test(d)&&cur.test(m.currency||''))inc+=Number(m.amount)});
  return {cost:c,income:inc};
}
function feeFor(i){return (isCedear(i)||/acci/i.test(i.group))?S.comPct:0.61}
function isCedear(i){return /cedear/i.test(i.group)}
function totals(){
  var r=rate(),res=0,cost=0,val=0;
  items.forEach(function(i){
    var rl=realFor(i),rv=rl?(i.amount+rl.income-rl.cost):i.ret;if(rv!=null){var v=i.cur==='USD'?(r?rv*r:0):rv;res+=v}
    if(i.ars!=null){val+=i.ars}
  });
  var ca=cashArs();
  return {res:res,val:val,cash:ca,patr:val+ca,rate:r};
}

/* ---- vistas ---- */
function explain(t,b){return '<details><summary>'+esc(t)+'</summary><p>'+b+'</p></details>'}
function renderResumen(){
  if(!D){return}
  var T=totals(),h='';
  var v=Math.abs(T.res)<1?'Sin variación':(T.res>0?'Ganando':'Perdiendo');
  h+='<div class="c"><p class="m">Hoy, con lo que compraste y todavía tenés</p><p class="verdict '+cls(T.res)+'">'+v+'</p><p class="big '+cls(T.res)+'">'+sg(T.res)+'</p><p class="m">Se calcula con tus movimientos reales: lo que pagaste con comisiones, lo que vale hoy y los intereses o dividendos que ya cobraste. Todavía no descuenta la comisión de venta, porque no vendiste. El simulador de Vender sí la descuenta, y por eso puede mostrar menos.</p></div>';
  h+='<div class="c"><div class="r"><span>Tu plata total en PPI</span><b>'+ars(T.patr)+'</b></div><div class="r"><span>Invertida</span><b>'+ars(T.val)+'</b></div><div class="r"><span>Quieta (efectivo)</span><b>'+ars(T.cash)+'</b></div>'
   +(T.rate?'<div class="r"><span class="m">Dólar usado para convertir</span><b>'+ars(T.rate)+'</b></div>':'<p class="note">No pude calcular el dólar. Cargalo en la pestaña Reparto para ver todo en pesos.</p>')+'</div>';
  h+='<p class="m">Costo por operación que uso en los cálculos: <b>'+f2(S.comPct)+'%</b> en CEDEARs (comisión de PPI más derechos de mercado, con IVA) y 0,61% en obligaciones negociables. Se cambia en la pestaña Vender.</p>';
  h+=explain('¿Cómo se calcula?','La ganancia sale de comparar el precio de hoy con el precio promedio al que compraste (esos datos los da PPI). Lo que está en dólares se pasa a pesos con el dólar de arriba, que se deduce de tus propias posiciones. No incluye impuestos.');
  h+='<button class="btn p" id="copyBtn">Copiar resumen para consultar con Claude</button><p id="copyMsg" class="m" hidden></p><textarea id="copyBox" readonly hidden></textarea>';
  h+='<button class="btn" id="reload">Actualizar datos</button>';
  $('v-resumen').innerHTML=h;
  $('copyBtn').onclick=copySummary;$('reload').onclick=function(){$('st').textContent='Actualizando…';load()};
}
function sold(){
  if(!Array.isArray(M))return null;
  var held={};items.forEach(function(i){if(i.qty>0)held[String(i.ticker).toUpperCase()]=1});
  var cur={};M.forEach(function(m){if(/^(COMPRA|VENTA)/i.test(m.description||'')){var t=String(m.ticker).toUpperCase();(cur[t]=cur[t]||{})[/dolar/i.test(m.currency||'')?'usd':'ars']=1}});
  var by={},vol=0;
  M.forEach(function(m){var d=String(m.description||''),t=String(m.ticker).toUpperCase();
    if(!/^(COMPRA|VENTA)/i.test(d)||held[t]||/dolar/i.test(m.currency||'')||(cur[t]&&cur[t].usd))return;
    var o=by[t]||(by[t]={t:t,net:0,buy:0,first:'9999',last:''});var a=Number(m.amount)||0;o.net+=a;if(a<0)o.buy+=-a;vol+=Math.abs(a);
    var dt=String(m.agreementDate).slice(0,10);if(dt<o.first)o.first=dt;if(dt>o.last)o.last=dt});
  var list=Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return b.net-a.net});
  var cau=0,fondo=0;
  M.forEach(function(m){var d=String(m.description||''),a=Number(m.amount)||0;
    if(/cauci[oó]n colocadora/i.test(d))cau+=a;
    if(/Liquidaci[oó]n de (Suscripci[oó]n|Rescate)/i.test(d))fondo+=a});
  var tot=0;list.forEach(function(o){tot+=o.net});
  return {list:list,tot:tot,cau:cau,fondo:fondo,fees:vol*0.007865};
}
function renderSold(){
  var s=sold();if(!s||!s.list.length)return '';
  var h='<h2>Lo que ya vendiste</h2><p class="m">Resultado en pesos de las inversiones que cerraste, ya con comisiones. No incluye el AL30, que usaste para cambiar de moneda.</p>';
  s.list.forEach(function(o){var pc=o.buy>0?o.net/o.buy*100:null;
    h+='<div class="c"><div class="r"><span class="t">'+esc(o.t)+'</span><b class="'+cls(o.net)+'">'+sg(o.net)+(pc!=null?' ('+sg(pc,'%')+')':'')+'</b></div><p class="m">Del '+esc(o.first.split('-').reverse().join('/'))+' al '+esc(o.last.split('-').reverse().join('/'))+'</p></div>'});
  h+='<div class="c"><div class="r"><span class="t">Total vendido</span><b class="'+cls(s.tot)+'">'+sg(s.tot)+'</b></div>'
   +(Math.abs(s.cau)>0.5?'<div class="r"><span>Intereses de cauciones</span><b class="'+cls(s.cau)+'">'+sg(s.cau)+'</b></div>':'')
   +(Math.abs(s.fondo)>0.5?'<div class="r"><span>Fondo común de inversión</span><b class="'+cls(s.fondo)+'">'+sg(s.fondo)+'</b></div>':'')
   +'<div class="r"><span class="m">Comisiones pagadas (estimadas)</span><b>'+ars(s.fees)+'</b></div>'
   +'<p class="m">Las comisiones ya están descontadas en cada resultado. Las estimo aplicando 0,79% a todo lo que compraste y vendiste.</p></div>';
  return h;
}
function renderPos(){
  if(!D)return;var h='<h2>Lo que tenés</h2>';
  if(!items.length)h+='<p class="info">Todavía no tenés inversiones en la cuenta.</p>';
  items.forEach(function(i){
    var u=i.cur==='USD'?usd:ars;
    h+='<div class="c"><div class="r"><span class="t">'+esc(i.ticker)+' <span class="m">'+esc(i.group)+'</span></span><b>'+u(i.amount)+'</b></div><p class="m">'+esc(i.desc)+'</p>'
     +'<div class="r"><span>Cantidad</span><b>'+f0(i.qty)+'</b></div><div class="r"><span>Precio hoy</span><b>'+f2(i.price)+'</b></div>'
     +'<div class="r"><span>Precio promedio de compra</span><b>'+f2(i.ppc)+'</b></div>'
     +(i.ret!=null?'<div class="r"><span>Rendimiento acumulado (PPI)</span><b class="'+cls(i.ret)+'">'+sg(i.ret,i.cur==='USD'?'usd':'')+' ('+sg(i.retPct,'%')+')</b></div>':'')
     +(function(){var rl=realFor(i);if(!rl)return '';var u2=i.cur==='USD'?usd:ars,sgk=i.cur==='USD'?'usd':'',res=i.amount+rl.income-rl.cost;
       return '<div class="r"><span>Pagaste en total (con comisiones)</span><b>'+u2(rl.cost)+'</b></div><div class="r"><span>Intereses o dividendos cobrados</span><b>'+u2(rl.income)+'</b></div><div class="r"><span class="t">Resultado real hasta hoy</span><b class="'+cls(res)+'">'+sg(res,sgk)+'</b></div><p class="m">Calculado con tus movimientos: lo que pagaste con comisiones, lo que vale hoy y los cobros recibidos. Todavía no descuenta la comisión de venta.</p>'})()
     +(i.ppc>0&&i.qty>0?'<div class="r"><span>Solo por el precio, hoy</span><b class="'+cls(i.amount-i.ppc*i.qty)+'">'+sg(i.amount-i.ppc*i.qty,i.cur==='USD'?'usd':'')+'</b></div><p class="m">El rendimiento de PPI incluye lo que ya cobraste de intereses o dividendos. La línea de abajo es lo que variaría el precio desde que compraste, sin contar esos cobros. Es aproximada porque PPI redondea el precio.</p>':'')
     +(i.ars!=null&&i.cur==='USD'?'<div class="r"><span class="m">Equivale a</span><b>'+ars(i.ars)+'</b></div>':'')+'</div>';
    if(/^ON|obligac/i.test(i.group))h+=explain('¿Qué es una obligación negociable (ON)?','Es un préstamo que le hacés a una empresa. A cambio te paga intereses cada tanto y te devuelve el capital al vencimiento. Su precio sube y baja mientras tanto. Si la vendés antes de que venza, podés ganar o perder según el precio de ese día.');
  });
  h+='<h2>Efectivo</h2><div class="c">';
  if(!cash.length)h+='<p class="m">No tenés efectivo disponible.</p>';
  cash.forEach(function(c){h+='<div class="r"><span>'+esc(c.name)+'</span><b>'+(c.cur==='USD'?usd(c.amount):ars(c.amount))+'</b></div>'});
  h+='</div>'+explain('¿Por qué hay dos dólares?','MEP y CCL son dos formas legales de tener dólares a través de la bolsa. Para vos son parecidos: el MEP es dólar billete y el CCL es dólar divisa. Con ambos podés comprar CEDEARs si el instrumento lo permite.');
  h+=renderSold();
  $('v-posiciones').innerHTML=h;
}
function renderVender(){
  if(!D)return;var held=items.filter(function(i){return i.qty>0});
  var h='<h2>¿Y si vendo?</h2><p class="m">Probá a qué precio vendés y mirá cuánto te queda después de comisiones.</p>';
  if(!held.length){$('v-vender').innerHTML=h+'<p class="info">No tenés nada para simular.</p>';return}
  h+='<div class="c"><label>Qué vendés<select id="sT">'+held.map(function(i,k){return '<option value="'+k+'">'+esc(i.ticker)+'</option>'}).join('')+'</select></label>'
   +'<div class="two"><label>Cantidad<input id="sQ" inputmode="decimal"></label><label>Precio de venta<input id="sP" inputmode="decimal"></label></div>'
   +'<label>Comisión total (%) <span class="m">PPI + derechos de mercado, con IVA donde corresponde</span><input id="sC" inputmode="decimal" value="'+fi(feeFor(held[0]))+'" placeholder="0"></label><div id="sOut" class="w" style="gap:8px"></div></div>';
  h+=explain('¿Qué es el precio de equilibrio?','Es el precio mínimo al que tenés que vender para no perder plata una vez descontadas las comisiones de compra y de venta.');
  $('v-vender').innerHTML=h;
  function cur(){return held[Number($('sT').value)]}

  var T=d.tech;
  h+='<div class="r"><div><h3>'+esc(t)+'</h3><p class="m">'+esc(d.name)+'</p></div><button class="btn" data-rm="'+esc(t)+'" aria-label="Sacar '+esc(t)+'" style="min-height:36px;padding:4px 12px">✕</button></div>';
  h+='<div class="big">US$'+n2.format(d.price)+'</div>';
  h+='<div class="chips"><span class="chip">1 mes <b class="'+cls(T.r1m)+'">'+pc(T.r1m)+'</b></span><span class="chip">3 meses <b class="'+cls(T.r3m)+'">'+pc(T.r3m)+'</b></span><span class="chip">1 año <b class="'+cls(T.r1y)+'">'+pc(T.r1y)+'</b></span></div>';
  h+='<p class="info">'+esc(d.summary)+'</p>'+spark(T.series);
  h+='<h3 style="margin-top:6px">Gráfico: cómo se mueve el precio</h3>'+lights(d.tech_lights);
  h+='<h3 style="margin-top:6px">Empresa: cómo le va al negocio</h3>'+(d.fund_lights.length?lights(d.fund_lights):'<p class="m">Sin datos de fundamentos por ahora.</p>');
  h+='<p class="m">Soporte reciente (mínimo de 3 meses): US$'+n2.format(T.sup)+' · Resistencia reciente (máximo de 3 meses): US$'+n2.format(T.res)+'.</p>';
  (d.errors||[]).forEach(function(e){h+='<p class="note">'+esc(e)+'</p>'});
  return h+'</div>'}
function renderAnalisis(){
  var h='<h2>Análisis</h2><p class="m">Mira la acción de EE.UU. que está detrás de cada CEDEAR (datos públicos de Yahoo Finance, pueden venir con demora). Tocá cada indicador para ver qué significa.</p>';
  h+='<div class="note">Describe lo que pasó y cómo está la empresa. No predice el futuro ni te dice qué comprar o vender, y no se entera de noticias nuevas como una renuncia o una demanda.</div>';
  h+=S.watch.map(aCard).join('');
  h+='<div class="c"><h3>Agregar acción</h3><div class="two"><label>Código de EE.UU. (ej: TSLA)<input id="aNew" autocapitalize="characters" autocomplete="off" placeholder="TSLA"></label><button class="btn p" id="aAdd" style="align-self:end">Agregar</button></div><button class="btn" id="aRef">Actualizar datos</button></div>';
  h+='<p class="m">Esto es información, no asesoramiento financiero.</p>';
  $('v-analisis').innerHTML=h;
  $('aAdd').onclick=function(){var v=($('aNew').value||'').trim().toUpperCase();if(/^[A-Z.\-]{1,10}$/.test(v)&&S.watch.indexOf(v)<0){S.watch.push(v);save();renderAnalisis();loadAnalisis()}};
  $('aRef').onclick=function(){A={};loadAnalisis(true)};
  document.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){var t=this.dataset.rm;S.watch=S.watch.filter(function(x){return x!==t});delete A[t];save();renderAnalisis()}});
}
var aBusy=false;
function loadAnalisis(force){
  if(aBusy)return;
  var todo=S.watch.filter(function(t){return force||!A[t]});if(!todo.length)return;
  aBusy=true;todo.forEach(function(t){AL[t]=true});renderAnalisis();
  (function next(i){
    if(i>=todo.length){aBusy=false;return}
    var t=todo[i];
    fetch('/api/analisis/'+encodeURIComponent(t)).then(function(r){if(r.status===401){location.reload();throw new Error('sesión')}return r.json()}).then(function(d){A[t]=d.detail?{error:d.detail}:d}).catch(function(){A[t]={error:'No hay conexión o el servicio no respondió.'}}).then(function(){delete AL[t];renderAnalisis();next(i+1)})
  })(0)
}
function renderAll(){renderResumen();renderPos();renderVender();renderReparto();renderMetas();if(!aBusy)renderAnalisis();renderConsejos()}
function route(){
  var h=location.hash.slice(1);if(['resumen','posiciones','vender','reparto','metas','analisis','consejos'].indexOf(h)<0)h='resumen';
  document.querySelectorAll('[data-v]').forEach(function(s){s.hidden=s.dataset.v!==h});
  document.querySelectorAll('[data-t]').forEach(function(a){a.className=a.dataset.t===h?'on':''});
  window.scrollTo(0,0);if(h==='analisis')loadAnalisis();
}
window.addEventListener('hashchange',route);route();load();
})();
</script>
</html>
